plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
}

allprojects {
    group = 'com.fincore'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        // Testcontainers needs to know where the Docker daemon socket is.
        // This machine uses Colima (not Docker Desktop), so point at its socket
        // unless DOCKER_HOST is already set in the environment.
        environment 'DOCKER_HOST', System.getenv('DOCKER_HOST') ?: "unix://${System.getProperty('user.home')}/.colima/default/docker.sock"
        // Ryuk (Testcontainers' cleanup helper) has known issues starting under Colima's VM.
        // Disabling it is the documented workaround; containers are still cleaned up via
        // Testcontainers' JVM shutdown hooks instead.
        environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
    }
}
